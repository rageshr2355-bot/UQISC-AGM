<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b0a10">
<title>UQISC AGM — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Gloock&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
  body { font-size: 15px; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 18px 16px 60px; }
  header.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 6px 0 18px; border-bottom: 1px solid var(--line); }
  header.top .logo { width: 96px; }
  header.top h1 { font-size: 30px; }
  header.top .spacer { flex: 1; }
  header.top .links { display: flex; gap: 8px; flex-wrap: wrap; }

  .strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 18px 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .card h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--cream-dim); font-weight: 700; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .big { font-size: 34px; font-weight: 800; color: var(--gold); letter-spacing: .14em; font-variant-numeric: tabular-nums; }
  .big.num { letter-spacing: 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .stack { display: grid; gap: 10px; }
  .small { font-size: 13px; }

  nav.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin: 6px 0 20px; }
  nav.tabs button { background: none; border: 0; border-bottom: 2.5px solid transparent; padding: 10px 14px; font-weight: 700; color: var(--cream-dim); cursor: pointer; }
  nav.tabs button[aria-selected="true"] { color: var(--gold); border-bottom-color: var(--gold); }
  nav.tabs .count { font-size: 12px; color: var(--cream-faint); margin-left: 4px; }

  .group-title { text-align: center; margin: 28px 0 14px; font-size: 22px; }
  .group-title:first-child { margin-top: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  @media (max-width: 400px) { .grid { grid-template-columns: 1fr; } }
  .pos { display: grid; gap: 12px; align-content: start; }
  .pos.live { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok) inset; }
  .pos-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .pos-head h4 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.05; }
  .pos-head .seats { font-size: 13px; color: var(--cream-dim); margin-top: 4px; }
  .cands { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .cands li { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-radius: 10px; background: rgba(20,4,7,.45); border: 1px solid var(--line); }
  .cands li .who { flex: 1; min-width: 0; }
  .cands li .who b { display: block; overflow-wrap: anywhere; }
  .cands li .who span { font-size: 13px; color: var(--cream-dim); }
  .empty { color: var(--cream-faint); font-style: italic; font-size: 14px; padding: 4px 0; }
  .addform { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .addform .input { min-height: 40px; padding: 8px 12px; }
  .addform .blurb { grid-column: 1 / -1; }
  .pollbox { border-top: 1px dashed var(--line); padding-top: 12px; display: grid; gap: 10px; }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--cream-dim); cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--gold); }
  .progress { height: 8px; border-radius: 8px; background: rgba(233,185,73,.14); overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--ok); transition: width .4s; }
  .res { display: grid; gap: 6px; }
  .res .r { display: grid; grid-template-columns: minmax(0, 1fr) 46px; gap: 4px 10px; align-items: center; font-size: 14px; }
  .res .r .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res .r .lbl.win { color: var(--gold); font-weight: 700; }
  .res .r .n { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .res .r .b { grid-column: 1 / -1; height: 5px; border-radius: 5px; background: rgba(233,185,73,.12); overflow: hidden; }
  .res .r .b i { display: block; height: 100%; background: var(--rose); }
  .res .r .b i.win { background: var(--gold); }
  .tie { color: var(--danger); font-weight: 700; font-size: 14px; }

  .two { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 18px; align-items: start; }
  @media (max-width: 820px) { .two { grid-template-columns: 1fr; } }
  .list { display: grid; gap: 12px; }
  .award-card { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .award-card .t { font-family: var(--display); font-size: 22px; }
  .award-card .rcp { color: var(--gold); font-weight: 700; }
  .attendees { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
  .attendees li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 8px 8px 12px; border-radius: 10px; background: rgba(20,4,7,.45); border: 1px solid var(--line); }
  .attendees li span { font-size: 12px; color: var(--cream-faint); }

  .login { min-height: 100dvh; display: grid; place-items: center; padding: 16px; }
  .login form { width: min(420px, 100%); padding: 70px 30px 34px; text-align: center; display: grid; gap: 16px; }
  .login .logo { margin: 0 auto; width: 120px; }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<div class="conn" id="conn" hidden><span class="dot"></span><span>Reconnecting…</span></div>
<div id="root"></div>

<script src="/common.js"></script>
<script>
const KEY = "uqisc_agm_admin", TAB = "uqisc_agm_tab";
const root = document.getElementById("root");
const esc = UQ.esc;
let key = UQ.storage.get(KEY), v = null, tab = UQ.storage.get(TAB) || "elections", live = null;

// ---------------------------------------------------------------- login
function login(msg = "") {
  root.innerHTML = `<div class="login"><form class="arch" id="loginForm">${UQ.logo()}
    <h1 class="display" style="font-size:40px">Control room</h1>
    <p class="muted" style="margin:0">UQISC AGM admin. Enter the password shown when the server started.</p>
    <input class="input" type="password" id="pw" placeholder="Admin password" autofocus>
    <p class="error-msg">${esc(msg)}</p>
    <button class="btn primary">Enter</button></form></div>`;
  document.getElementById("loginForm").onsubmit = async (e) => {
    e.preventDefault();
    const pw = document.getElementById("pw").value;
    try { await UQ.post("/api/admin/login", {}, { "X-Admin-Key": pw }); key = pw; UQ.storage.set(KEY, pw); start(); }
    catch (err) { login(err.message); }
  };
}

async function act(action, body = {}) {
  try { return await UQ.post("/api/admin/" + action, body, { "X-Admin-Key": key }); }
  catch (err) {
    if (err.status === 401) { UQ.storage.del(KEY); live && live.close(); login("Session expired. Log in again."); }
    UQ.toast(err.message, true);
    throw err;
  }
}

// ---------------------------------------------------------------- helpers
const latestPoll = (pid) => [...v.polls].reverse().find((p) => p.positionId === pid && !p.superseded);
const onAir = (p) => (v.screen.mode === "voting" || v.screen.mode === "results") && v.screen.pollId === p.id;
const fmtTime = (t) => new Date(t * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

function statusPill(p) {
  if (!p) return `<span class="pill">No vote yet</span>`;
  const air = onAir(p) ? ` <span class="pill onair">On air</span>` : "";
  return (p.status === "open" ? `<span class="pill open"><span class="dot pulse"></span>Voting</span>` : `<span class="pill closed">Closed</span>`) + air;
}

function results(p) {
  const t = p.tally, max = Math.max(1, ...Object.values(t.counts));
  const rows = [...p.options].sort((a, b) => t.counts[b.id] - t.counts[a.id]);
  return `<div class="res">${rows.map((o) => {
    const win = t.winners.includes(o.id), tie = t.tied.includes(o.id);
    return `<div class="r"><span class="lbl ${win || tie ? "win" : ""}">${win ? "★ " : tie ? "= " : ""}${esc(o.label)}${tie ? " (tie)" : ""}</span><span class="n">${t.counts[o.id]}</span>
      <span class="b"><i class="${win ? "win" : ""}" style="width:${(t.counts[o.id] / max) * 100}%"></i></span></div>`;
  }).join("")}</div>${t.tie ? `<div class="tie">Tie for the last seat — consider a run-off.</div>` : ""}`;
}

function pollControls(p, { rerun } = {}) {
  const n = v.attendeeCount, b = p.tally.ballots;
  const air = onAir(p);
  if (p.status === "open") {
    return `<div class="row" style="justify-content:space-between"><b>${b} <span class="muted" style="font-weight:500">of ${n} voted</span></b>
        <span class="small faint">opened ${fmtTime(p.openedAt)}</span></div>
      <div class="progress"><i style="width:${n ? Math.min(100, (b / n) * 100) : 0}%"></i></div>
      <div class="row">
        <button class="btn primary sm" data-act="closePoll" data-poll="${p.id}">Close voting</button>
        ${air && v.screen.mode === "voting" ? `<button class="btn sm" data-act="screenWait">Take off screen</button>`
          : `<button class="btn sm" data-act="screen" data-mode="voting" data-poll="${p.id}">Show on screen</button>`}
      </div>`;
  }
  return `${results(p)}
    <div class="row small faint">${b} ballots · closed ${p.closedAt ? fmtTime(p.closedAt) : ""}</div>
    <div class="row">
      ${air && v.screen.mode === "results" ? `<button class="btn sm live" data-act="screenWait">● On air — take off</button>`
        : `<button class="btn primary sm" data-act="screen" data-mode="results" data-poll="${p.id}">Air results</button>`}
      <button class="btn sm" data-act="reopenPoll" data-poll="${p.id}">Reopen</button>
      ${rerun ? `<button class="btn sm" data-act="rerun" data-pid="${rerun}">Re-run vote</button>`
        : `<button class="btn danger sm" data-act="deletePoll" data-poll="${p.id}">Delete</button>`}
    </div>`;
}

// ---------------------------------------------------------------- sections
function positionCard(pos) {
  const cands = v.candidates[pos.id] || [];
  const p = latestPoll(pos.id);
  const locked = p && p.status === "open";
  return `<article class="card pos ${locked ? "live" : ""}">
    <div class="pos-head"><div><h4>${esc(pos.title)}</h4>
      <div class="seats">${pos.seats > 1 ? `${pos.seats} seats · voters choose up to ${pos.seats}` : "1 seat"}</div></div>
      <div class="row" style="justify-content:flex-end">${statusPill(p)}</div></div>
    <ul class="cands">${cands.length ? cands.map((c, i) => `<li><div class="who"><b>${esc(c.name)}</b>${c.blurb ? `<span>${esc(c.blurb)}</span>` : ""}</div>
      <button class="btn icon" title="Move up" data-act="moveCandidate" data-pid="${pos.id}" data-cid="${c.id}" data-dir="-1" ${i === 0 || locked ? "disabled" : ""}>↑</button>
      <button class="btn icon" title="Move down" data-act="moveCandidate" data-pid="${pos.id}" data-cid="${c.id}" data-dir="1" ${i === cands.length - 1 || locked ? "disabled" : ""}>↓</button>
      <button class="btn icon danger" title="Remove" data-act="removeCandidate" data-pid="${pos.id}" data-cid="${c.id}" data-name="${esc(c.name)}" ${locked ? "disabled" : ""}>✕</button></li>`).join("")
      : `<li class="empty" style="background:none;border:0;padding:0">No candidates yet</li>`}</ul>
    <form class="addform" data-form="cand" data-pid="${pos.id}">
      <input class="input" id="cn-${pos.id}" placeholder="Add candidate (incl. floor nominations)" maxlength="60" ${locked ? "disabled" : ""}>
      <button class="btn sm" ${locked ? "disabled" : ""}>Add</button>
      <input class="input blurb" id="cb-${pos.id}" placeholder="Optional one-liner (e.g. degree, year)" maxlength="140" ${locked ? "disabled" : ""}>
    </form>
    <div class="pollbox">${p ? pollControls(p, { rerun: pos.id }) : `
      <div class="row" style="justify-content:flex-end">
        <button class="btn primary sm" data-act="openPos" data-pid="${pos.id}" ${cands.length ? "" : "disabled"}>Open voting</button>
      </div>`}</div>
  </article>`;
}

function electionsTab() {
  const groups = [];
  for (const pos of v.positions) {
    let g = groups.find((x) => x.name === pos.group);
    if (!g) groups.push((g = { name: pos.group, items: [] }));
    g.items.push(pos);
  }
  return groups.map((g) => `<h2 class="group-title"><span class="eyebrow">${esc(g.name)}</span></h2>
    <div class="grid">${g.items.map(positionCard).join("")}</div>`).join("");
}

function motionsTab() {
  const polls = v.polls.filter((p) => p.kind === "custom").reverse();
  return `<div class="two">
    <form class="card stack" data-form="custom">
      <h3>New motion / poll</h3>
      <div class="field"><label for="m-title">Question</label><input class="input" id="m-title" maxlength="140" placeholder="e.g. Adopt the amended constitution?"></div>
      <div class="field"><label for="m-sub">Details (optional)</label><input class="input" id="m-sub" maxlength="200" placeholder="Moved by … seconded by …"></div>
      <div class="field"><label for="m-opts">Options, one per line</label><textarea class="input" id="m-opts" rows="4">For\nAgainst</textarea></div>
      <div class="row" style="justify-content:space-between">
        <div class="field" style="grid-auto-flow:column;align-items:center;gap:8px"><label for="m-max">Max choices</label>
          <input class="input" id="m-max" type="number" min="1" max="12" value="1" style="width:76px;min-height:40px"></div>
      </div>
      <button class="btn primary">Create &amp; open voting</button>
      <p class="small faint" style="margin:0">Opening a poll closes any other open poll.</p>
    </form>
    <div class="list">${polls.length ? polls.map((p) => `<article class="card pos ${p.status === "open" ? "live" : ""}">
        <div class="pos-head"><div><h4>${esc(p.title)}</h4>${p.subtitle ? `<div class="seats">${esc(p.subtitle)}</div>` : ""}</div><div class="row">${statusPill(p)}</div></div>
        <div class="pollbox">${pollControls(p)}</div></article>`).join("")
      : `<div class="card empty">No motions yet. Use this for constitutional amendments, procedural votes, or anything else the meeting needs to decide.</div>`}</div>
  </div>`;
}

function awardsTab() {
  const air = (a) => v.screen.mode === "award" && v.screen.awardId === a.id;
  return `<div class="two">
    <form class="card stack" data-form="award">
      <h3>New special award</h3>
      <div class="field"><label for="aw-title">Award</label><input class="input" id="aw-title" maxlength="80" placeholder="e.g. Volunteer of the Year"></div>
      <div class="field"><label for="aw-rcp">Recipient</label><input class="input" id="aw-rcp" maxlength="80" placeholder="Name"></div>
      <div class="field"><label for="aw-blurb">Citation (optional)</label><textarea class="input" id="aw-blurb" maxlength="240" rows="3" placeholder="For going above and beyond at Diwali Night…"></textarea></div>
      <button class="btn primary">Add award</button>
    </form>
    <div class="list">${v.awards.length ? v.awards.map((a, i) => `<article class="card award-card">
        <div><div class="t">${esc(a.title)}</div><div class="rcp">${esc(a.recipient)}</div>${a.blurb ? `<div class="small muted" style="margin-top:4px">${esc(a.blurb)}</div>` : ""}</div>
        <div class="row">
          ${air(a) ? `<button class="btn sm live" data-act="screenWait">● On air — take off</button>`
            : `<button class="btn primary sm" data-act="screen" data-mode="award" data-award="${a.id}">Present on screen</button>`}
          <button class="btn icon" title="Move up" data-act="moveAward" data-award="${a.id}" data-dir="-1" ${i === 0 ? "disabled" : ""}>↑</button>
          <button class="btn icon" title="Move down" data-act="moveAward" data-award="${a.id}" data-dir="1" ${i === v.awards.length - 1 ? "disabled" : ""}>↓</button>
          <button class="btn icon danger" title="Delete" data-act="removeAward" data-award="${a.id}" data-name="${esc(a.title)}">✕</button>
        </div></article>`).join("") : `<div class="card empty">No awards yet. Add them here, then present each one on the big screen when it's time.</div>`}</div>
  </div>`;
}

function attendeesTab() {
  const q = (document.getElementById("att-q")?.value || "").trim().toLowerCase();
  const list = [...v.attendees].sort((a, b) => a.name.localeCompare(b.name))
    .filter((a) => !q || a.name.toLowerCase().includes(q) || (a.code || "").toLowerCase().includes(q));
  return `<div class="card stack">
    <div class="row" style="justify-content:space-between">
      <h3 style="margin:0">${v.attendeeCount} checked in · ${v.codesTotal - v.codesUsed} codes unused</h3>
      <button class="btn danger sm" data-act="resetAttendance">Clear all check-ins</button>
    </div>
    <input class="input" id="att-q" placeholder="Search by name or code" style="max-width:340px;min-height:40px">
    <p class="small faint" style="margin:0">Removing someone signs their phone out and frees their code, so they can check in again with the same card (e.g. on a new phone). Votes already cast are kept.</p>
    ${list.length ? `<ul class="attendees">${list.map((a) => `<li><div><b>${esc(a.name)}</b><br><span>Code ${esc(a.code || "—")} · ${fmtTime(a.joinedAt)}</span></div>
      <button class="btn icon danger" title="Remove" data-act="removeAttendee" data-id="${a.id}" data-name="${esc(a.name)}">✕</button></li>`).join("")}</ul>`
      : `<div class="empty">${q ? "No matches." : "Nobody has checked in yet."}</div>`}
  </div>`;
}

function settingsTab() {
  return `<div class="two">
    <form class="card stack" data-form="event">
      <h3>Event details</h3>
      <div class="field"><label for="ev-title">Title</label><input class="input" id="ev-title" maxlength="80" value="${esc(v.event.title)}"></div>
      <div class="field"><label for="ev-sub">Subtitle</label><input class="input" id="ev-sub" maxlength="80" value="${esc(v.event.subtitle)}"></div>
      <button class="btn primary">Save</button>
    </form>
    <div class="card stack">
      <h3>Voting codes</h3>
      <p class="small muted" style="margin:0">${v.codesTotal} single-use personal codes. Print them, cut them out and hand one to each member as they arrive.</p>
      <div class="row"><a class="btn primary sm" href="/codes" target="_blank" rel="noopener">Print code cards ↗</a>
        <button class="btn danger sm" data-act="regenerateCodes">Generate new codes</button></div>
      <p class="small faint" style="margin:0">Generating new codes makes every printed card useless and signs everyone out.</p>
    </div>
    <div class="card stack">
      <h3>Danger zone</h3>
      <p class="small muted" style="margin:0">Wipes every candidate, poll, result, award and check-in. Voting codes are kept (and freed up). Download results first.</p>
      <div class="row"><a class="btn sm" href="/api/admin/export.csv?key=${encodeURIComponent(key)}">Download results CSV</a>
        <button class="btn danger sm" data-act="factoryReset">Reset everything</button></div>
    </div>
  </div>`;
}

// ---------------------------------------------------------------- main render
function screenLabel() {
  const s = v.screen;
  if (s.mode === "award") return `Award: ${v.awards.find((a) => a.id === s.awardId)?.title || ""}`;
  const p = v.polls.find((x) => x.id === s.pollId);
  if (s.mode === "voting" && p) return `Live vote: ${p.title}`;
  if (s.mode === "results" && p) return `Results: ${p.title}`;
  return "Waiting screen";
}

function draw() {
  if (!v) return;
  const active = v.polls.find((p) => p.id === v.activePollId);
  const tabs = [["elections", "Elections"], ["motions", "Motions"], ["awards", "Awards", v.awards.length], ["attendees", "Attendees", v.attendeeCount], ["settings", "Settings"]];
  const body = { elections: electionsTab, motions: motionsTab, awards: awardsTab, attendees: attendeesTab, settings: settingsTab }[tab]();
  UQ.render(root, `<div class="wrap">
    <header class="top">${UQ.logo()}<h1 class="display">Control room</h1><span class="spacer"></span>
      <div class="links">
        <a class="btn sm" href="/screen" target="_blank" rel="noopener">Open big screen ↗</a>
        <a class="btn sm" href="/" target="_blank" rel="noopener">Audience view ↗</a>
        <button class="btn sm" data-act="logout">Log out</button>
      </div></header>

    <section class="strip">
      <div class="card"><h3>Check-in ${v.checkinOpen ? `<span class="pill open">Open</span>` : `<span class="pill">Closed</span>`}</h3>
        <div class="big num">${v.attendeeCount}</div>
        <div class="small faint">members checked in · ${v.codesUsed} of ${v.codesTotal} codes used</div>
        <div class="row" style="margin-top:10px">
          <button class="btn sm ${v.checkinOpen ? "" : "primary"}" data-act="checkin" data-open="${!v.checkinOpen}">${v.checkinOpen ? "Close check-in" : "Reopen check-in"}</button>
          <a class="btn sm" href="/codes" target="_blank" rel="noopener">Print codes ↗</a>
        </div></div>
      <div class="card"><h3>Open vote ${active ? `<span class="pill open"><span class="dot pulse"></span>Live</span>` : ""}</h3>
        ${active ? `<div style="font-weight:700;font-size:17px">${esc(active.title)}</div>
          <div class="small muted">${active.tally.ballots} of ${v.attendeeCount} voted</div>
          <div class="row" style="margin-top:10px"><button class="btn primary sm" data-act="closePoll" data-poll="${active.id}">Close voting</button></div>`
          : `<div class="small muted">No vote is open. Audience phones show the waiting screen.</div>`}</div>
      <div class="card"><h3>Big screen ${v.screen.mode !== "waiting" ? `<span class="pill onair">On air</span>` : ""}</h3>
        <div style="font-weight:700">${esc(screenLabel())}</div>
        <div class="row" style="margin-top:10px">
          <button class="btn sm" data-act="screenWait" ${v.screen.mode === "waiting" ? "disabled" : ""}>Back to waiting</button>
        </div></div>
    </section>

    <nav class="tabs" role="tablist">${tabs.map(([id, label, n]) => `<button role="tab" aria-selected="${tab === id}" data-tab="${id}">${label}${n != null ? `<span class="count">${n}</span>` : ""}</button>`).join("")}</nav>
    <main>${body}</main>
  </div>`);
}

// ---------------------------------------------------------------- events
root.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-tab]");
  if (t) { tab = t.dataset.tab; UQ.storage.set(TAB, tab); return draw(); }
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const d = b.dataset;
  try {
    switch (d.act) {
      case "logout": UQ.storage.del(KEY); live && live.close(); return login();
      case "moveCandidate": return await act("moveCandidate", { positionId: d.pid, candidateId: d.cid, dir: +d.dir });
      case "removeCandidate":
        if (confirm(`Remove ${d.name}?`)) await act("removeCandidate", { positionId: d.pid, candidateId: d.cid });
        return;
      case "openPos":
        await act("openPositionPoll", { positionId: d.pid });
        return UQ.toast("Voting is open — ballots are on everyone's phones.");
      case "rerun":
        if (confirm("Re-run this vote? The previous result will be discarded and a fresh ballot opened with the current candidate list.")) {
          await act("openPositionPoll", { positionId: d.pid });
          UQ.toast("New vote opened.");
        }
        return;
      case "closePoll": await act("closePoll", { pollId: d.poll }); return UQ.toast("Voting closed.");
      case "reopenPoll": return await act("reopenPoll", { pollId: d.poll });
      case "deletePoll": if (confirm("Delete this poll and its results?")) await act("deletePoll", { pollId: d.poll }); return;
      case "screen": return await act("setScreen", { mode: d.mode, pollId: d.poll, awardId: d.award });
      case "screenWait": return await act("setScreen", { mode: "waiting" });
      case "moveAward": return await act("moveAward", { awardId: d.award, dir: +d.dir });
      case "removeAward": if (confirm(`Delete “${d.name}”?`)) await act("removeAward", { awardId: d.award }); return;
      case "checkin": return await act("setCheckin", { open: d.open === "true" });
      case "regenerateCodes": {
        const c = prompt("This replaces ALL voting codes. Printed cards stop working and everyone is signed out. Type NEW CODES to confirm.");
        if (c) { await act("regenerateCodes", { confirm: c }); UQ.toast("New codes generated — reprint the cards."); }
        return;
      }
      case "removeAttendee": if (confirm(`Sign out ${d.name} and free their code?`)) await act("removeAttendee", { attendeeId: d.id }); return;
      case "resetAttendance": if (confirm("Sign out every attendee? They'll all need to check in again.")) await act("resetAttendance"); return;
      case "factoryReset": {
        const c = prompt("This wipes EVERYTHING. Type RESET to confirm.");
        if (c) { await act("factoryReset", { confirm: c }); UQ.toast("Everything has been reset."); }
        return;
      }
    }
  } catch {}
});

root.addEventListener("input", (e) => { if (e.target.id === "att-q") draw(); });

root.addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target, val = (id) => document.getElementById(id).value;
  const clear = (...ids) => ids.forEach((id) => (document.getElementById(id).value = ""));
  try {
    if (f.dataset.form === "cand") {
      const pid = f.dataset.pid;
      if (!val("cn-" + pid).trim()) return;
      await act("addCandidate", { positionId: pid, name: val("cn-" + pid), blurb: val("cb-" + pid) });
      clear("cn-" + pid, "cb-" + pid);
      document.getElementById("cn-" + pid)?.focus();
    }
    if (f.dataset.form === "custom") {
      await act("createCustomPoll", {
        title: val("m-title"), subtitle: val("m-sub"), options: val("m-opts").split("\n"),
        maxChoices: +val("m-max") || 1,
      });
      clear("m-title", "m-sub");
      UQ.toast("Poll is open.");
    }
    if (f.dataset.form === "award") {
      await act("addAward", { title: val("aw-title"), recipient: val("aw-rcp"), blurb: val("aw-blurb") });
      clear("aw-title", "aw-rcp", "aw-blurb");
      UQ.toast("Award added.");
    }
    if (f.dataset.form === "event") {
      await act("setEvent", { title: val("ev-title"), subtitle: val("ev-sub") });
      UQ.toast("Saved.");
    }
  } catch {}
});

async function start() {
  try { await UQ.post("/api/admin/login", {}, { "X-Admin-Key": key }); }
  catch (err) { UQ.storage.del(KEY); return login(err.status === 401 ? "" : err.message); }
  root.innerHTML = `<p class="center muted" style="margin-top:30vh">Connecting…</p>`;
  live = UQ.stream(() => ({ role: "admin", key }), (data) => { v = data; draw(); },
    (ok) => (document.getElementById("conn").hidden = ok));
}

key ? start() : login();
</script>
</body>
</html>
